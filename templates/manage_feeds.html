<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Feeds - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">📡 {{ app_name }}</a>
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/create">Create Feed</a></li>
                        <li><a href="/manage">Manage Feeds</a></li>
                        <li><a href="/docs">API Docs</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h1 class="card-title">Manage Feeds</h1>
                    <a href="/create" class="btn btn-primary">Create New Feed</a>
                </div>
                
                <div id="feedList">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading feeds...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 {{ app_name }}</p>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>
