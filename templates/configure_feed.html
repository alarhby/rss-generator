<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Feed - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">📡 {{ app_name }}</a>
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/create">Create Feed</a></li>
                        <li><a href="/manage">Manage Feeds</a></li>
                        <li><a href="/docs">API Docs</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card">
                <h1 class="card-title">Configure Feed</h1>
                <input type="hidden" id="feed_id" value="{{ feed_id }}">
                
                <div class="form-group">
                    <button class="btn btn-primary" onclick="previewFeed()">Preview Feed</button>
                    <button class="btn btn-secondary" onclick="viewFeed('{{ feed_id }}')">View RSS</button>
                    <a href="/manage" class="btn btn-secondary">Back to Manage</a>
                </div>

                <div id="preview_results" style="margin-top: 2rem;">
                    <p>Click "Preview Feed" to see extracted items</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 {{ app_name }}</p>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>
